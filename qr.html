<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .table-container { width: 100%; overflow-x: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #007bff; color: white; }
        #status { text-align: center; font-weight: bold; margin-bottom: 15px; color: #333; }
        .loading { color: #f39c12; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <div id="status">Đang khởi tạo máy ảnh...</div>
    
    <!-- Khung quét QR -->
    <div id="reader"></div>

    <!-- Bảng dữ liệu phía dưới -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>STT (Row)</th>
                    <th>Mã ID (Cột A)</th>
                    <th>Thời gian (Cột B)</th>
                    <th>Nội dung QR (Cột E)</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Link Google Apps Script Web App của bạn
    const API_URL = "https://script.google.com/macros/s/AKfycbwYJnl7kuWclf8wpfTqB_RHHlEuqnjRae9HtTUoQWvV8eKxJsihjXrOkq-QfNzETmVG/exec"; 
    
    let html5QrCode;
    let isProcessing = false; // Chống quét liên tục cùng 1 mã khi đang chờ API

    // Hàm tạo định dạng ID (YYMMDDHHMMSS + 2 số ngẫu nhiên)
    function generateID() {
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const rand = String(Math.floor(Math.random() * 100)).padStart(2, '0');
        return `${yy}${mm}${dd}${hh}${min}${ss}${rand}`;
    }

    // Hàm tạo định dạng thời gian (hh:mm:ss dd/mm/yyyy)
    function generateTimestamp() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        return `${hh}:${min}:${ss} ${dd}/${mm}/${yyyy}`;
    }

    // Render bảng dữ liệu
    function renderTable(dataArray) {
        const tbody = document.getElementById("dataTableBody");
        tbody.innerHTML = "";
        if (!dataArray || dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Chưa có dữ liệu</td></tr>`;
            return;
        }
        
        // Render ngược để mã mới quét hiện lên đầu
        dataArray.slice().reverse().forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.row || '-'}</td>
                <td>${row.A || ''}</td>
                <td>${row.B || ''}</td>
                <td>${row.E || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Hiển thị trạng thái
    function setStatus(text, type) {
        const statusEl = document.getElementById("status");
        statusEl.textContent = text;
        statusEl.className = type;
    }

    // Gửi Request tới Server (Google Apps Script)
    async function sendRequest(payload) {
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.status === "success" && result.all_data) {
                renderTable(result.all_data);
            }
            return result;
        } catch (error) {
            console.error("API Error:", error);
            setStatus("Lỗi kết nối máy chủ!", "error");
            return null;
        }
    }

    // Lấy dữ liệu lúc mới vào web
    async function loadInitialData() {
        setStatus("Đang tải dữ liệu...", "loading");
        const payload = { sheet: "QR", action: "get" };
        const result = await sendRequest(payload);
        if (result && result.status === "success") {
            setStatus("Sẵn sàng quét QR", "success");
        }
    }

    // Hàm xử lý khi quét được QR
    async function onScanSuccess(decodedText) {
        if (isProcessing) return; // Đang gửi API thì không quét mã tiếp
        isProcessing = true;
        
        // Play âm thanh bíp nhẹ (tuỳ chọn)
        navigator.vibrate && navigator.vibrate(200);
        setStatus(`Đã quét: ${decodedText}... Đang lưu!`, "loading");

        const payload = {
            sheet: "QR",
            action: "add",
            A: generateID(),
            B: generateTimestamp(),
            E: decodedText
        };

        const result = await sendRequest(payload);
        if (result && result.status === "success") {
            setStatus("Thêm dữ liệu thành công! Tiếp tục quét.", "success");
        } else {
            setStatus("Lỗi lưu dữ liệu. Hãy thử lại.", "error");
        }
        
        // Delay 1.5s trước khi cho quét mã tiếp theo để tránh trùng
        setTimeout(() => { isProcessing = false; }, 1500);
    }

    // Khởi tạo máy quét Camera
    function startCamera() {
        html5QrCode = new Html5Qrcode("reader");
        
        // Cấu hình: độ phân giải cao (1080p), tốc độ 30fps (không giật), có khung quét (qrbox)
        const config = {
            fps: 30,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
            videoConstraints: {
                facingMode: "environment", // Camera sau
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            setStatus("Không thể mở Camera. Vui lòng cấp quyền!", "error");
            console.error(err);
        });
    }

    // --- CÁC SỰ KIỆN VÒNG ĐỜI TRANG WEB ---

    // 1. Lúc mới vào trang: lấy data và bật camera
    window.onload = () => {
        loadInitialData();
        startCamera();
    };

    // 2. Tắt camera khi rời khỏi tab/chuyển ứng dụng
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => console.log("Camera stopped (hidden)")).catch(err => console.log(err));
            }
        } else if (document.visibilityState === "visible") {
            // Bật lại khi quay lại web (Nếu muốn)
            if (html5QrCode && !html5QrCode.isScanning) {
                startCamera();
            }
        }
    });

    // 3. Đảm bảo tắt camera khi đóng trang web (Before Unload)
    window.addEventListener("beforeunload", () => {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop();
        }
    });

</script>
</body>
</html>
