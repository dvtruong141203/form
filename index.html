<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Dữ liệu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-list {
            list-style: none;
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .nav-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
            font-weight: 500;
        }
        .nav-item:hover, .nav-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="sidebar-header">
            📁 Danh Mục Trang
        </div>
        <ul class="nav-list" id="navList">
            <li class="nav-item">Đang tải danh mục...</li>
        </ul>
    </sidebar>

    <div class="main-content">
        <iframe id="contentFrame" src=""></iframe>
    </div>

    <script>
        // Đường dẫn Web App Apps Script của bạn
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYtrzkbXMDIkzagqbIRHB1ZOV76GDO8On_Q5SrDC_5Nqt_Dzo6k8MWdvRRD0kYCZsI/exec';

        async function initApp() {
            // 1. Kiểm tra xem bộ nhớ trình duyệt đã ghi nhớ dữ liệu danh mục từ trước chưa
            let savedMenuData = localStorage.getItem('cached_sidebar_menu');
            
            if (savedMenuData) {
                // Nếu đã nhớ, hiển thị ngay lập tức để không phải chờ đợi
                renderMenu(JSON.parse(savedMenuData));
            }

            // 2. Đồng thời gọi ngầm lấy dữ liệu mới nhất từ URL Apps Script để cập nhật
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        // Ghi nhớ dữ liệu mới vào localStorage
                        localStorage.setItem('cached_sidebar_menu', JSON.stringify(data));
                        // Render lại menu theo dữ liệu mới nhất từ Google Sheets
                        renderMenu(data);
                    }
                }
            } catch (error) {
                console.log('Không thể kết nối mạng hoặc lỗi Apps Script, sử dụng dữ liệu đã ghi nhớ.', error);
                // Nếu chưa có cache từ trước mà gọi lỗi thì hiển thị thông báo dự phòng
                if (!savedMenuData) {
                    document.getElementById('navList').innerHTML = `
                        <li class="nav-item active" onclick="loadPage('ad.html', this)">Form (Dự phòng)</li>
                    `;
                    document.getElementById('contentFrame').src = 'ad.html';
                }
            }
        }

        function renderMenu(data) {
            const navList = document.getElementById('navList');
            navList.innerHTML = '';

            data.forEach((item, index) => {
                const li = document.createElement('li');
                // Kiểm tra nếu đang mở trang nào thì giữ trạng thái active
                li.className = `nav-item ${index === 0 ? 'active' : ''}`;
                li.textContent = item['Tên trang'] || `Trang ${index + 1}`;
                li.onclick = () => loadPage(item['File'], li);
                navList.appendChild(li);
            });

            // Tự động load file đầu tiên vào iframe nếu khung đang trống
            const iframe = document.getElementById('contentFrame');
            if (!iframe.src && data.length > 0 && data[0]['File']) {
                iframe.src = data[0]['File'];
            }
        }

        function loadPage(url, element) {
            if (!url) return;
            document.getElementById('contentFrame').src = url;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
        }

        // Chạy khởi động ứng dụng ngay khi mở trang
        initApp();
    </script>
</body>
</html>
