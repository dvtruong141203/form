<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện File Nhúng</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #121212; color: #fff; }
        
        .sidebar { 
            width: 260px; 
            background: rgba(30, 30, 30, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255,255,255,0.1); 
            display: flex; 
            flex-direction: column; 
            padding: 20px 0; 
            z-index: 10;
        }
        .sidebar h2 { text-align: center; margin-bottom: 25px; font-size: 1.4rem; color: #ffffff; font-weight: 600; letter-spacing: 1px; }
        
        .menu-list { display: flex; flex-direction: column; gap: 8px; padding: 0 15px; overflow-y: auto; }
        .menu-item { 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            color: #b0b0c0; 
            font-size: 1rem; 
            font-weight: 500;
        }
        .menu-item:hover { 
            background: rgba(255, 255, 255, 0.05); 
            color: #3b82f6; 
            transform: translateX(5px);
        }
        .menu-item.active { 
            background: rgba(255, 255, 255, 0.1);
            color: #3b82f6; 
            border-left: 4px solid #3b82f6;
            border-radius: 0 8px 8px 0;
        }

        .content { flex: 1; display: flex; flex-direction: column; background: #000000; position: relative; }
        .header { 
            padding: 15px 25px; 
            background: rgba(30, 30, 30, 0.9); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            font-size: 1.1rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
        }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        #loading { padding: 20px; text-align: center; color: #888; font-size: 0.9rem; }

        @media (max-width: 768px) { 
            body { flex-direction: column; } 
            .sidebar { 
                width: 100%; height: auto; flex-direction: row; align-items: center; justify-content: space-between; 
                padding: 10px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); 
            } 
            .sidebar h2 { display: none; } 
            .menu-list { flex-direction: row; padding: 0; gap: 10px; overflow-x: auto; width: 100%; white-space: nowrap; } 
            .menu-item { padding: 10px 15px; font-size: 0.95rem; } 
            .menu-item.active { border-left: none; border-bottom: 3px solid #3b82f6; border-radius: 8px 8px 0 0; }
            .menu-item:hover { transform: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Danh sách</h2>
        <div class="menu-list" id="menuList">
            <div id="loading">Đang tải dữ liệu...</div>
        </div>
    </div>

    <div class="content">
        <div class="header">
            <span id="currentTitle">Đang khởi tạo...</span>
        </div>
        <iframe id="mainFrame" src="" title="Nội dung web"></iframe>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYtrzkbXMDIkzagqbIRHB1ZOV76GDO8On_Q5SrDC_5Nqt_Dzo6k8MWdvRRD0kYCZsI/exec";
        const BASE_GITHUB_URL = "https://dvtruong141203.github.io/form/";

        const menuList = document.getElementById('menuList');
        const mainFrame = document.getElementById('mainFrame');
        const currentTitle = document.getElementById('currentTitle');

        async function fetchData() {
            try {
                // Fetch redirects automatically, but if CORS issues arise, ensure your Apps Script doGet uses ContentService.MimeType.JSON
                const response = await fetch(APPS_SCRIPT_URL);
                const webData = await response.json();
                
                menuList.innerHTML = ''; 

                if (!webData || webData.length === 0) {
                    menuList.innerHTML = '<div id="loading">Chưa có dữ liệu</div>';
                    currentTitle.textContent = "Không tìm thấy file nhúng";
                    return;
                }

                webData.forEach((item, index) => {
                    const menuItem = document.createElement('div');
                    menuItem.className = 'menu-item' + (index === 0 ? ' active' : '');
                    menuItem.textContent = item.title;
                    
                    menuItem.addEventListener('click', () => {
                        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                        menuItem.classList.add('active');
                        
                        mainFrame.src = BASE_GITHUB_URL + item.file;
                        currentTitle.textContent = "Đang hiển thị: " + item.title;
                    });

                    menuList.appendChild(menuItem);
                });

                mainFrame.src = BASE_GITHUB_URL + webData[0].file;
                currentTitle.textContent = "Đang hiển thị: " + webData[0].title;

            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
                menuList.innerHTML = '<div id="loading" style="color: #ef4444;">Lỗi kết nối API</div>';
                currentTitle.textContent = "Lỗi hệ thống";
            }
        }

        fetchData();
    </script>
</body>
</html>
