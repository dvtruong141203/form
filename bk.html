<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thêm Tài Khoản Ngân Hàng</title>
    <!-- Thêm font chữ Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body { 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .app-container {
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        /* --- FORM NHẬP LIỆU --- */
        .form-card {
            background: #ffffff; 
            padding: 30px 25px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }
        .form-card h2 { 
            margin: 0 0 25px 0; 
            font-size: 22px; 
            color: #1f2937; 
            text-align: center;
            font-weight: 700;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            color: #4b5563;
        }
        .form-group input, .form-group select {
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e5e7eb; 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            transition: 0.3s;
            background: #f9fafb;
            color: #111827;
        }
        .form-group input:focus, .form-group select:focus { 
            border-color: #3b82f6; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }
        .submit-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }
        .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; transform: translateY(0); box-shadow: none;}

        /* Loader Icon */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- MÀN HÌNH THÀNH CÔNG (SUCCESS CARD) --- */
        .success-card {
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            display: none;
            text-align: center;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            0% { transform: translateY(30px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Tiêu đề Logo */
        .success-header {
            background: #f8fafc;
            padding: 25px 20px;
            border-bottom: 2px dashed #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .success-header img {
            max-width: 150px;
            max-height: 45px;
            object-fit: contain;
        }
        
        .success-body { padding: 25px 20px; }
        
        .success-badge {
            display: inline-block;
            background: #d1fae5;
            color: #059669;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .info-row { margin-bottom: 15px; }
        .info-label { font-size: 13px; color: #6b7280; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
        .info-value { font-size: 18px; color: #111827; font-weight: 700; margin-top: 4px; }
        
        /* Mã QR */
        .qr-box {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 16px;
            display: inline-block;
        }
        .qr-box img {
            width: 220px;
            height: 220px;
            border-radius: 12px;
            background: white;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .success-footer { padding: 20px; background: #ffffff; }
        .reset-btn {
            width: 100%; padding: 16px; background: #f3f4f6; color: #374151; 
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        .reset-btn:hover { background: #e5e7eb; }

    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 1. GIAO DIỆN FORM NHẬP -->
    <div class="form-card" id="formCard">
        <h2>THÊM TÀI KHOẢN</h2>
        
        <div class="form-group">
            <label>Ngân hàng hưởng thụ</label>
            <select id="bankSelect">
                <option value="">Đang tải danh sách...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Số tài khoản</label>
            <input type="number" id="accNumber" placeholder="Nhập số tài khoản ngân hàng">
        </div>
        
        <div class="form-group">
            <label>Tên chủ tài khoản</label>
            <input type="text" id="accName" placeholder="NGUYEN VAN A" oninput="this.value = this.value.toUpperCase()">
        </div>
        
        <button class="submit-btn" id="submitBtn" onclick="submitForm()">
            <div class="spinner" id="btnSpinner"></div>
            <span id="btnText">Lưu & Tạo mã QR</span>
        </button>
    </div>

    <!-- 2. GIAO DIỆN BIÊN LAI THÀNH CÔNG -->
    <div class="success-card" id="successCard">
        <!-- Tiêu đề Logo ngân hàng -->
        <div class="success-header">
            <img id="resLogo" src="" alt="Bank Logo">
        </div>
        
        <div class="success-body">
            <div class="success-badge">✓ LƯU THÀNH CÔNG</div>
            
            <div class="info-row">
                <div class="info-label">Ngân hàng</div>
                <div class="info-value" id="resBankName">Vietcombank</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Số tài khoản</div>
                <div class="info-value" id="resAccNumber" style="color: #3b82f6; font-size: 22px;">123456789</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Chủ tài khoản</div>
                <div class="info-value" id="resAccName">NGUYEN VAN A</div>
            </div>
            
            <div class="qr-box">
                <img id="resQrImg" src="" alt="VietQR">
            </div>
        </div>
        
        <div class="success-footer">
            <button class="reset-btn" onclick="resetForm()">Thêm tài khoản khác</button>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwYJnl7kuWclf8wpfTqB_RHHlEuqnjRae9HtTUoQWvV8eKxJsihjXrOkq-QfNzETmVG/exec"; 

    // --- 1. LẤY DANH SÁCH NGÂN HÀNG ---
    async function loadBanks() {
        try {
            const res = await fetch("https://api.vietqr.io/v2/banks");
            const json = await res.json();
            if (json.code === "00") {
                const select = document.getElementById("bankSelect");
                select.innerHTML = '<option value="">-- Chọn ngân hàng --</option>';
                json.data.forEach(bank => {
                    const opt = document.createElement("option");
                    opt.value = bank.bin; // Dùng BIN làm Mã PIN
                    opt.text = `${bank.shortName} - ${bank.name}`;
                    opt.dataset.shortname = bank.shortName;
                    opt.dataset.logo = bank.logo;
                    select.appendChild(opt);
                });
            }
        } catch (error) {
            console.error("Lỗi:", error);
            document.getElementById("bankSelect").innerHTML = '<option value="">Lỗi mạng, hãy tải lại trang</option>';
        }
    }

    // --- 2. HÀM TẠO ID & THỜI GIAN ---
    function generateID() {
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const rand = String(Math.floor(Math.random() * 100)).padStart(2, '0');
        return `${yy}${mm}${dd}${hh}${min}${ss}${rand}`;
    }

    function generateTimestamp() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        return `${hh}:${min}:${ss} ${dd}/${mm}/${now.getFullYear()}`;
    }

    // --- 3. XỬ LÝ GỬI FORM ---
    async function submitForm() {
        const select = document.getElementById("bankSelect");
        const accNumber = document.getElementById("accNumber").value.trim();
        const accName = document.getElementById("accName").value.trim();

        if (!select.value || !accNumber || !accName) {
            alert("Vui lòng nhập đầy đủ thông tin!");
            return;
        }

        // Đổi trạng thái nút bấm (Đang lưu...)
        const btn = document.getElementById("submitBtn");
        const spinner = document.getElementById("btnSpinner");
        const btnText = document.getElementById("btnText");
        
        btn.disabled = true;
        spinner.style.display = "block";
        btnText.innerText = "Đang lưu lên hệ thống...";

        // Lấy thông tin option đã chọn
        const selectedOption = select.options[select.selectedIndex];
        const bin = selectedOption.value; 
        const bankName = selectedOption.dataset.shortname; 
        const logo = selectedOption.dataset.logo; 

        // URL Ảnh QR (W3qsUuN.jpg dùng template chuẩn của VietQR)
        const qrUrl = `https://api.vietqr.io/image/${bin}-${accNumber}-W3qsUuN.jpg?accountName=${encodeURIComponent(accName)}`;

        // Tạo Payload chuẩn JSON bạn yêu cầu (Thay cột E,F,G,H)
        const payload = { 
            sheet: "Ngân hàng", 
            action: "add", 
            A: generateID(), 
            B: generateTimestamp(), 
            C: bankName,
            D: bin,
            E: accNumber,
            F: accName,
            G: qrUrl,
            H: logo
        };

        try {
            // Gửi qua Google Apps Script
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if (result.status === "success") {
                showSuccessCard(bankName, logo, accNumber, accName, qrUrl);
            } else {
                alert("Lỗi từ máy chủ. Vui lòng thử lại!");
            }
        } catch (error) {
            alert("Đã xảy ra lỗi mạng!");
        } finally {
            // Khôi phục nút bấm
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "Lưu & Tạo mã QR";
        }
    }

    // --- 4. HIỂN THỊ MÀN HÌNH THÀNH CÔNG ---
    function showSuccessCard(bankName, logo, accNumber, accName, qrUrl) {
        // Gán dữ liệu vào Card
        document.getElementById("resLogo").src = logo;
        document.getElementById("resBankName").innerText = bankName;
        document.getElementById("resAccNumber").innerText = accNumber;
        document.getElementById("resAccName").innerText = accName;
        document.getElementById("resQrImg").src = qrUrl;

        // Ẩn Form, Hiện Card
        document.getElementById("formCard").style.display = "none";
        document.getElementById("successCard").style.display = "block";
    }

    // --- 5. QUAY LẠI FORM ĐỂ NHẬP TIẾP ---
    function resetForm() {
        document.getElementById("accNumber").value = "";
        document.getElementById("accName").value = "";
        
        document.getElementById("successCard").style.display = "none";
        document.getElementById("formCard").style.display = "block";
        document.getElementById("accNumber").focus();
    }

    // Khi tải trang xong
    window.onload = () => {
        loadBanks();
    };
</script>
</body>
</html>
