<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cổng Tạo Mã VietQR</title>
    <!-- Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            margin: 0; 
            padding: 20px; 
            /* Tone màu Xanh Navy chuẩn ngân hàng */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .app-container { width: 100%; max-width: 420px; position: relative; }

        /* --- 1. FORM NHẬP LIỆU --- */
        .form-card {
            background: #ffffff; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }
        .form-card h2 { 
            margin: 0 0 30px 0; 
            font-size: 22px; 
            color: #1e293b; 
            text-align: center;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group { margin-bottom: 22px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            color: #475569;
        }
        .form-group input, .form-group select {
            width: 100%; 
            padding: 15px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            transition: 0.3s;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 500;
        }
        .form-group input:focus, .form-group select:focus { 
            border-color: #2563eb; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .submit-btn { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
        }
        .submit-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4); 
        }

        /* --- 2. THẺ CHI TIẾT (MÀN HÌNH THÀNH CÔNG) --- */
        .detail-card {
            background: #ffffff; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            overflow: hidden;
            display: none; /* Mặc định ẩn */
            text-align: center;
            animation: fadeInScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes fadeInScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Logo to trên cùng */
        .detail-header {
            padding: 30px 20px 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .detail-header img {
            max-width: 200px; /* Logo cực to */
            max-height: 65px;
            object-fit: contain;
        }

        /* Khu vực QR Code */
        .qr-section {
            padding: 10px 20px 20px 20px;
        }
        .qr-box {
            display: inline-block;
            padding: 15px;
            background: #ffffff;
            border-radius: 20px;
            border: 2px dashed #cbd5e1;
        }
        .qr-box img {
            width: 240px;
            height: 240px;
            border-radius: 12px;
            
            /* --- CSS CẤM NHẤN GIỮ LƯU ẢNH --- */
            pointer-events: none; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            -khtml-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            -webkit-user-drag: none; 
        }

        /* Thông tin tài khoản */
        .info-section {
            background: #f8fafc;
            padding: 25px 25px;
            border-top: 1px solid #e2e8f0;
            text-align: left;
        }
        .info-row {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }
        .info-row:last-child { margin-bottom: 0; }
        
        .info-label { 
            font-size: 13px; 
            color: #64748b; 
            font-weight: 600; 
            text-transform: uppercase; 
            margin-bottom: 5px;
        }
        .info-value { 
            font-size: 16px; 
            color: #0f172a; 
            font-weight: 700; 
        }
        .acc-number-highlight {
            font-size: 24px;
            color: #1e3a8a; /* Xanh đậm nổi bật */
            letter-spacing: 1px;
        }

        /* Nút quay lại */
        .detail-footer { padding: 20px; background: #ffffff; border-top: 1px solid #f1f5f9;}
        .reset-btn {
            width: 100%; padding: 15px; background: #f1f5f9; color: #334155; 
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        .reset-btn:hover { background: #e2e8f0; }

    </style>
</head>
<body>

<div class="app-container">
    
    <!-- === MÀN HÌNH 1: FORM NHẬP === -->
    <div class="form-card" id="formCard">
        <h2>Tạo Mã VietQR</h2>
        
        <div class="form-group">
            <label>Ngân hàng hưởng thụ</label>
            <select id="bankSelect">
                <option value="">Đang tải danh sách...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Số tài khoản</label>
            <input type="number" id="accNumber" placeholder="Nhập số tài khoản ngân hàng">
        </div>
        
        <div class="form-group">
            <label>Tên chủ tài khoản</label>
            <input type="text" id="accName" placeholder="TÊN VIẾT HOA KHÔNG DẤU" oninput="this.value = this.value.toUpperCase()">
        </div>
        
        <button class="submit-btn" onclick="submitForm()">TẠO MÃ QR NGAY</button>
    </div>

    <!-- === MÀN HÌNH 2: XEM CHI TIẾT === -->
    <div class="detail-card" id="detailCard">
        
        <!-- Tiêu đề Logo to -->
        <div class="detail-header">
            <img id="resLogo" src="" alt="Logo Ngân hàng">
        </div>
        
        <!-- Mã QR (Đã chặn lưu ảnh) -->
        <div class="qr-section">
            <div class="qr-box">
                <img id="resQrImg" src="" alt="Mã VietQR">
            </div>
            <div style="margin-top: 10px; font-size: 13px; color: #10b981; font-weight: 600;">
                ✓ Quét mã bằng ứng dụng Ngân hàng
            </div>
        </div>
        
        <!-- Thông tin chi tiết -->
        <div class="info-section">
            <div class="info-row">
                <div class="info-label">Ngân hàng</div>
                <div class="info-value" id="resBankName">...</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Số tài khoản</div>
                <div class="info-value acc-number-highlight" id="resAccNumber">...</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Chủ tài khoản</div>
                <div class="info-value" id="resAccName">...</div>
            </div>
        </div>
        
        <div class="detail-footer">
            <button class="reset-btn" onclick="resetForm()">Tạo tài khoản khác</button>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwYJnl7kuWclf8wpfTqB_RHHlEuqnjRae9HtTUoQWvV8eKxJsihjXrOkq-QfNzETmVG/exec"; 

    // 1. TẢI DANH SÁCH NGÂN HÀNG
    async function loadBanks() {
        try {
            const res = await fetch("https://api.vietqr.io/v2/banks");
            const json = await res.json();
            if (json.code === "00") {
                const select = document.getElementById("bankSelect");
                select.innerHTML = '<option value="">-- Chọn ngân hàng --</option>';
                json.data.forEach(bank => {
                    const opt = document.createElement("option");
                    opt.value = bank.bin; // Mã PIN
                    opt.text = `${bank.shortName} - ${bank.name}`;
                    opt.dataset.shortname = bank.shortName;
                    opt.dataset.logo = bank.logo;
                    select.appendChild(opt);
                });
            }
        } catch (error) {
            document.getElementById("bankSelect").innerHTML = '<option value="">Lỗi mạng, hãy tải lại trang</option>';
        }
    }

    // 2. HÀM TRỢ GIÚP TẠO ID & THỜI GIAN
    function generateID() {
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const rand = String(Math.floor(Math.random() * 100)).padStart(2, '0');
        return `${yy}${mm}${dd}${hh}${min}${ss}${rand}`;
    }

    function generateTimestamp() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        return `${hh}:${min}:${ss} ${dd}/${mm}/${now.getFullYear()}`;
    }

    // 3. XỬ LÝ LƯU NGAY LẬP TỨC
    function submitForm() {
        const select = document.getElementById("bankSelect");
        const accNumber = document.getElementById("accNumber").value.trim();
        const accName = document.getElementById("accName").value.trim();

        if (!select.value || !accNumber || !accName) {
            alert("Vui lòng nhập đầy đủ thông tin!");
            return;
        }

        // Lấy thông tin từ lựa chọn
        const selectedOption = select.options[select.selectedIndex];
        const bin = selectedOption.value; 
        const bankName = selectedOption.dataset.shortname; 
        const logo = selectedOption.dataset.logo; 

        // Sinh link QR code
        const qrUrl = `https://api.vietqr.io/image/${bin}-${accNumber}-W3qsUuN.jpg?accountName=${encodeURIComponent(accName)}`;

        // HIỂN THỊ MÀN HÌNH CHI TIẾT NGAY LẬP TỨC (Không cần đợi API)
        document.getElementById("resLogo").src = logo;
        document.getElementById("resBankName").innerText = bankName;
        document.getElementById("resAccNumber").innerText = accNumber;
        document.getElementById("resAccName").innerText = accName;
        document.getElementById("resQrImg").src = qrUrl;

        document.getElementById("formCard").style.display = "none";
        document.getElementById("detailCard").style.display = "block";

        // GỬI DỮ LIỆU LÊN GOOGLE SHEET Ở CHẾ ĐỘ NGẦM (BACKGROUND)
        const payload = { 
            sheet: "Ngân hàng", 
            action: "add", 
            A: generateID(), 
            B: generateTimestamp(), 
            C: bankName,
            D: bin,
            E: accNumber,
            F: accName,
            G: qrUrl,
            H: logo
        };

        // Hàm fetch chạy ngầm, người dùng không bị block UI
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        }).then(response => response.json())
          .then(result => {
              console.log("Đã lưu ngầm thành công lên Google Sheet!", result);
          }).catch(error => {
              console.error("Lỗi khi lưu ngầm:", error);
          });
    }

    // 4. RESET FORM ĐỂ TẠO MỚI
    function resetForm() {
        document.getElementById("accNumber").value = "";
        document.getElementById("accName").value = "";
        
        document.getElementById("detailCard").style.display = "none";
        document.getElementById("formCard").style.display = "block";
        document.getElementById("accNumber").focus();
    }

    window.onload = () => { loadBanks(); };
</script>
</body>
</html>
